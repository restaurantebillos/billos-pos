<body>
  <div id="root"></div>
  
  <script type="module">
// BILLO'S MENU SYNC - Ventanita Sheet
window.BILLOS_MENU_FROM_SHEET = null;
try {
  const cached = localStorage.getItem('billos_menuCatalogo');
  if(cached) {
    window.BILLOS_MENU_FROM_SHEET = JSON.parse(cached);
    console.log('[BILLOS] Menu cache cargado', window.BILLOS_MENU_FROM_SHEET.length);
  }
  const appsUrl = localStorage.getItem('billos_appsScriptUrl') || localStorage.getItem('billos_appsScriptUrl_backup') || window.BILLOS_APPS_SCRIPT_URL || '';
  if(appsUrl) {
    fetch(appsUrl + (appsUrl.includes('?') ? '&' : '?') + 'action=menu')
      .then(r=>r.json())
      .then(d=>{
        if(d.ok && d.menu && d.menu.length){
          window.BILLOS_MENU_FROM_SHEET = d.menu;
          localStorage.setItem('billos_menuCatalogo', JSON.stringify(d.menu));
          localStorage.setItem('billos_menuLastSync', new Date().toISOString());
          console.log('[BILLOS] Menu actualizado desde Sheet', d.menu.length);
          // Mostrar toast si existe funcion
          if(window.dispatchEvent) window.dispatchEvent(new CustomEvent('billos:menuUpdated', {detail:d.menu}));
        }
      }).catch(()=>{});
  }
} catch(e){ console.warn('Menu sync error', e); }

function billosGetMenuBase(nombre){
  try{
    const sheetMenu = window.BILLOS_MENU_FROM_SHEET;
    if(sheetMenu && sheetMenu.length){
      const found = sheetMenu.find(m=> m.platillo && m.platillo.toLowerCase() === nombre.toLowerCase());
      if(found) return found.precio_base || found.precio_completo || found.precio_solo;
    }
  }catch(e){}
  return null;
}
function billosGetMenuPrecio(nombre, tipo){
  try{
    const sheetMenu = window.BILLOS_MENU_FROM_SHEET;
    if(sheetMenu && sheetMenu.length){
      const found = sheetMenu.find(m=> m.platillo && m.platillo.toLowerCase() === nombre.toLowerCase());
      if(found){
        if(tipo==='solo' && found.precio_solo) return found.precio_solo;
        if(tipo==='completo' && found.precio_completo) return found.precio_completo;
        return found.precio_base || found.precio_completo || found.precio_solo;
      }
    }
  }catch(e){}
